services:
  - type: web
    name: ai-execellence-training-platform
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: NODE_VERSION
        value: 20.18.1
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ai-execellence-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ai-execellence-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ai-execellence-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ai-execellence-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ai-execellence-db
          property: password
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_MIGRATIONS
        value: "true"

databases:
  - name: ai-execellence-db
    plan: free
    databaseName: ai_execellence
